<!DOCTYPE html>
<html lang="en-us">
  <title>OpenShift OAuth Templates</title>
  {% include "head.html" %}
  <body>
    {{ content }}
    <script>
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList = "pf-v6-theme-dark";
      }

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
          document.documentElement.classList.toggle("pf-v6-theme-dark", event.matches);
      });
    </script>
  </body>
</html>
