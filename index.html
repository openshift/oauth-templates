---
layout: index
---

<main class="pf-v6-u-p-md">
  <h1 class="pf-v6-c-title pf-m-h1 pf-m-page-title">OAuth Templates</h1>
  {% for brand in brands %}
  {% assign brand_items = collections[brand.label] %}
  <h2 class="pf-v6-c-title pf-m-h2">{{ brand.name }}</h2>
  <ul class="pf-v6-c-list">
    {% for item in brand_items %}
    <li>
      <a href="{{ item.url }}">{{ item.data.layout }}</a>
    </li>
    {% endfor %}
  </ul>
  {% endfor %}
</main>
